<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMS-style updates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0E2A47; --saffron:#E29227; --paper:#FAF6EE; --ink:#1B1B1B; --green:#2F7D5D; --bubble:#EFEAE0; --line:#D8CFBC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:#e9e4d8; font-family:'IBM Plex Sans',sans-serif; display:flex; align-items:center; justify-content:center; padding:32px; color:var(--ink); }
  .phone{ width:340px; height:660px; background:#000; border-radius:38px; padding:12px; box-shadow:0 40px 70px -25px rgba(14,42,71,0.5); }
  .screen{ width:100%; height:100%; background:var(--paper); border-radius:28px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .status{ display:flex; justify-content:space-between; padding:10px 20px 4px; font-family:'IBM Plex Mono',monospace; font-size:11px; }
  .head{ background:var(--navy); color:#fff; padding:12px 16px 14px; display:flex; align-items:center; gap:10px; }
  .avatar{ width:34px; height:34px; border-radius:50%; background:var(--saffron); color:var(--navy); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .head h1{ font-size:13.5px; margin:0; font-weight:600; }
  .head .sub{ font-size:10.5px; opacity:.75; margin-top:1px; }

  .setup{ padding:16px 14px; display:flex; flex-direction:column; gap:10px; }
  .setup input, .setup select{ padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:13px; }
  .setup button{ padding:11px; border:none; border-radius:6px; background:var(--navy); color:#fff; font-family:inherit; font-size:13.5px; cursor:pointer; }
  .setup .hint{ font-size:11px; color:#8a8577; }
  .setup .or{ font-size:11px; color:#8a8577; text-align:center; }

  .thread{ flex:1; padding:16px 14px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; display:none; }
  .bubble{ max-width:82%; background:var(--bubble); border-radius:14px 14px 14px 3px; padding:10px 12px; font-size:12.8px; line-height:1.45; align-self:flex-start; }
  .bubble .time{ display:block; font-size:9.5px; color:#8a8577; margin-top:5px; font-family:'IBM Plex Mono',monospace; }
  .bubble .num{ font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--navy); }
  .bubble.priority{ background:#FDF1DD; border-left:3px solid var(--saffron); border-radius:4px 14px 14px 3px; }
  .bubble.called{ background:#E9F3EE; border-left:3px solid var(--green); border-radius:4px 14px 14px 3px; }
  .bubble.called .num{ color:var(--green); }
  .conn{ padding:8px 14px; font-size:10px; font-family:'IBM Plex Mono',monospace; text-align:center; }
  .conn.ok{ color:var(--green); } .conn.bad{ color:#B5493D; }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status"><span>9:41</span><span>Seva Kendra</span></div>
      <div class="head">
        <div class="avatar">SK</div>
        <div><h1>Seva Kendra Updates</h1><div class="sub" id="head-sub">Enter a token to begin</div></div>
      </div>

      <div class="setup" id="setup">
        <div class="hint">Enter your token ID (shown at the kiosk) to see live status here.</div>
        <input id="tokenIdInput" placeholder="Paste token _id from kiosk" />
        <button onclick="startFromId()">Track this token</button>
      </div>

      <div class="conn bad" id="conn"></div>
      <div class="thread" id="thread"></div>
    </div>
  </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const API_BASE = window.API_BASE || 'http://localhost:5000';
  let tokenId = null, lastAhead = null, lastWait = null, socket = null;

  function now(){ return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }

  function addBubble(html, cls=''){
    const thread = document.getElementById('thread');
    const div = document.createElement('div');
    div.className = 'bubble ' + cls;
    div.innerHTML = html + `<span class="time">${now()}</span>`;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }

  function setConn(ok, text){
    const el = document.getElementById('conn');
    el.textContent = text;
    el.className = 'conn ' + (ok ? 'ok' : 'bad');
  }

  async function startFromId(){
    const id = document.getElementById('tokenIdInput').value.trim();
    if(!id) return;
    tokenId = id;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('thread').style.display = 'flex';
    await refresh(true);
    connectSocket();
    setInterval(() => refresh(false), 10000); // fallback poll
  }

  async function refresh(isFirst){
    if(!tokenId) return;
    try{
      const res = await fetch(`${API_BASE}/api/tokens/${tokenId}/status`);
      if(!res.ok){ setConn(false, 'token not found'); return; }
      const s = await res.json();
      document.getElementById('head-sub').textContent = (s.serviceType || '') + (s.assignedCounter ? ' · ' + s.assignedCounter : '');
      setConn(true, 'live · connected');

      if(isFirst){
        addBubble(`You've joined the queue. Your token is <span class="num">${s.tokenNumber || tokenId}</span>.`);
        if(s.peopleAhead !== undefined && s.estimatedWait !== undefined){
          addBubble(`${s.peopleAhead} people are ahead of you. Estimated wait: <b>${s.estimatedWait} min</b>.`);
        }
        lastAhead = s.peopleAhead; lastWait = s.estimatedWait;
        return;
      }

      if(s.status === 'called'){
        addBubble(`🔔 It's your turn! Token <span class="num">${s.tokenNumber || tokenId}</span>, please proceed to <b>${s.assignedCounter || 'your counter'}</b> now.`, 'called');
        return;
      }
      if(s.priorityChanged){
        addBubble(`A priority change was applied ahead of you by staff. This may adjust your wait time.`, 'priority');
      }
      if(s.peopleAhead !== lastAhead || s.estimatedWait !== lastWait){
        addBubble(`Update: ${s.peopleAhead} people ahead of you. Estimated wait: <b>${s.estimatedWait} min</b>.`);
        lastAhead = s.peopleAhead; lastWait = s.estimatedWait;
      }
    }catch(err){
      setConn(false, 'backend unreachable');
    }
  }

  function connectSocket(){
    socket = io(API_BASE);
    socket.on('connect', () => setConn(true, 'live · connected'));
    socket.on('disconnect', () => setConn(false, 'live · disconnected, retrying'));
    socket.on('queueUpdated', () => refresh(false));
  }

  // Allow the kiosk page to hand off a token id via URL: sms.html?token=<id>
  const params = new URLSearchParams(window.location.search);
  if(params.get('token')){
    document.getElementById('tokenIdInput').value = params.get('token');
    startFromId();
  }
</script>
</body>
</html>
