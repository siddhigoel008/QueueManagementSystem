<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Now Serving — Public Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0E2A47; --navy-2:#123253; --saffron:#E9A23B; --ink:#EDEBE3; --green:#4FAE85; --line:rgba(255,255,255,0.12); }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--navy);
    background-image: radial-gradient(circle at 15% 10%, var(--navy-2), var(--navy) 55%);
    font-family:'IBM Plex Sans',sans-serif; color:var(--ink);
    display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .board{ width:920px; }
  .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .seal{ width:38px; height:38px; border-radius:50%; border:2px solid var(--saffron); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .brand h1{ font-family:'Fraunces',serif; font-size:20px; margin:0; font-weight:600; }
  .brand .sub{ font-size:11px; opacity:.65; margin-top:2px; }
  .status-line{ font-size:10px; font-family:'IBM Plex Mono',monospace; margin-top:2px; }
  .status-line.ok{ color:var(--green); } .status-line.bad{ color:#E9A9A0; }
  .clock{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .date{ font-size:10.5px; opacity:.6; text-align:right; margin-top:2px; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .panel{ background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:8px; padding:18px 18px 16px; position:relative; overflow:hidden; }
  .panel .svc{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; opacity:.7; font-weight:600; }
  .panel .counter{ font-size:13px; color:var(--saffron); margin-top:2px; font-weight:500; }
  .now{ margin-top:16px; }
  .now .label{ font-size:10.5px; opacity:.6; text-transform:uppercase; letter-spacing:.08em; }
  .now .digits{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:40px; margin-top:4px; }
  .waiting{ margin-top:14px; display:flex; justify-content:space-between; font-size:11.5px; opacity:.75; border-top:1px solid var(--line); padding-top:10px; }
  .waiting b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }
  .status-dot{ position:absolute; top:18px; right:18px; width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  .ticker{ margin-top:18px; border-top:1px solid var(--line); padding-top:10px; font-size:11.5px; opacity:.7; white-space:nowrap; overflow:hidden; }
  .ticker span{ display:inline-block; padding-left:100%; animation:scroll 22s linear infinite; }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
</style>
</head>
<body>
  <div class="board">
    <div class="top">
      <div class="brand">
        <div class="seal">&#127470;&#127475;</div>
        <div>
          <h1>Municipal Service Centre — Now Serving</h1>
          <div class="sub">Public Display · All Counters</div>
          <div class="status-line bad" id="conn">connecting to backend…</div>
        </div>
      </div>
      <div>
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">—</div>
      </div>
    </div>
    <div class="grid" id="grid">
      <div class="panel"><div class="svc">Loading…</div></div>
    </div>
    <div class="ticker"><span>Please keep your token number visible · Priority citizens are called as verified by staff · For assistance, visit the reception desk</span></div>
  </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const API_BASE = window.API_BASE || 'http://https://queue-backend-82a8.onrender.com';
  let services = [];

  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('date').textContent = d.toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long'});
  }
  tick(); setInterval(tick, 1000*20);

  function setConn(ok, text){
    const el = document.getElementById('conn');
    el.textContent = text;
    el.className = 'status-line ' + (ok ? 'ok' : 'bad');
  }

  async function loadServices(){
    try{
      const res = await fetch(`${API_BASE}/api/services`);
      services = await res.json();
      renderShell();
      refreshAll();
      setConn(true, 'live · connected');
      connectSocket();
    }catch(err){
      document.getElementById('grid').innerHTML = `<div class="panel"><div class="svc">Can't reach backend at ${API_BASE}</div></div>`;
      setConn(false, 'backend unreachable');
    }
  }

  function renderShell(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    services.forEach(svc => {
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.id = `panel-${svc.code}`;
      panel.innerHTML = `
        <div class="status-dot"></div>
        <div class="svc">${svc.name}</div>
        <div class="counter" id="counter-${svc.code}">—</div>
        <div class="now"><div class="label">Now Serving</div><div class="digits" id="serving-${svc.code}">—</div></div>
        <div class="waiting"><span>Waiting</span><b id="waiting-${svc.code}">—</b></div>
      `;
      grid.appendChild(panel);
    });
  }

  async function refreshOne(code){
    try{
      const res = await fetch(`${API_BASE}/api/display/${code}`);
      if(!res.ok) return;
      const data = await res.json();
      document.getElementById(`serving-${code}`).textContent = data.currentToken || '—';
      document.getElementById(`counter-${code}`).textContent = data.counter ? `Counter ${data.counter}` : '';
      document.getElementById(`waiting-${code}`).textContent = data.waitingCount ?? '—';
    }catch(err){ /* ignore transient errors */ }
  }

  function refreshAll(){ services.forEach(s => refreshOne(s.code)); }

  function connectSocket(){
    const socket = io(API_BASE);
    services.forEach(s => socket.emit('joinServiceRoom', s.code));
    socket.on('queueUpdated', refreshAll);
    socket.on('connect', () => setConn(true, 'live · connected'));
    socket.on('disconnect', () => setConn(false, 'live · disconnected, retrying'));
  }

  loadServices();
  setInterval(refreshAll, 15000); // fallback poll in case a socket event is missed
</script>
</body>
</html>
